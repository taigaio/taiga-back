# ponytail: dev gateway. /static and /media go straight to the back, which
# serves them itself because DEBUG=True (taiga/urls.py). Production uses a
# taiga-protected service for /media and nginx alias for /static.
server {
    listen 80 default_server;
    client_max_body_size 100M;
    charset utf-8;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location / {
        proxy_pass http://front/;
    }

    location /api/ {
        proxy_pass http://back:8000/api/;
    }

    location /admin/ {
        proxy_pass http://back:8000/admin/;
    }

    location /static/ {
        proxy_pass http://back:8000/static/;
    }

    location /media/ {
        proxy_pass http://back:8000/media/;
    }
}
